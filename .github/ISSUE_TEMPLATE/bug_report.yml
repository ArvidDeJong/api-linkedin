name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem, such as a token ending up in a log? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include the exception type and message if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The code that connects or publishes, and the relevant config, trimmed to the smallest example that fails. Leave out client secrets and tokens.
      render: php
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.5.0"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.0"
    validations:
      required: true
  - type: input
    id: api-version
    attributes:
      label: LinkedIn API version
      description: The value of LINKEDIN_API_VERSION, and which products the LinkedIn app has.
      placeholder: 202601, Share on LinkedIn
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"
    validations:
      required: true
